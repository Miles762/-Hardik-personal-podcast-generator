# Render Blueprint — one-click deploy of the whole stack.
# https://render.com/docs/blueprint-spec
#
# Creates three resources:
#   1. podcast-db        — managed Postgres 16
#   2. podcast-backend   — FastAPI (Docker), migrates + seeds on boot, serves audio
#   3. podcast-frontend  — Next.js production server (Docker), proxies /api + /audio
#
# After the first deploy you only need to paste two secrets (the OpenAI and
# ElevenLabs keys) — everything else is wired automatically.

databases:
  - name: podcast-db
    databaseName: podcast
    plan: free
    postgresMajorVersion: "16"

services:
  # ---------------------------- Backend (FastAPI) ----------------------------
  - type: web
    name: podcast-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # NOTE: Render does not allow a persistent `disk:` on the free plan, so
    # generated MP3s live on the container's ephemeral filesystem and are lost
    # when the free instance sleeps/restarts — a fresh Generate re-creates them,
    # which is fine for a demo. To persist audio, bump this service to a paid
    # plan (e.g. `plan: starter`) and re-add:
    #   disk:
    #     name: audio
    #     mountPath: /app/static/audio
    #     sizeGB: 1
    envVars:
      # asyncpg-compatible URL is derived from the DB automatically; the app
      # also normalizes the scheme defensively (see core/config.py).
      - key: DATABASE_URL
        fromDatabase:
          name: podcast-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      # The browser reaches the backend through the frontend's same-origin
      # proxy, so this is a belt-and-suspenders allow-list for the public URL.
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: podcast-frontend
          property: host
      # Live generation is ON: paste your real keys in the Render dashboard.
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false

  # ---------------------------- Frontend (Next.js) ---------------------------
  - type: web
    name: podcast-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    # Render builds the Dockerfile's final stage, which is `runner` — the lean
    # production image (node server.js). (Blueprint YAML has no dockerTarget
    # field, so the multi-stage Dockerfile is ordered with runner last.)
    envVars:
      # Server-side proxy target. We use the backend's PUBLIC URL rather than a
      # `fromService` private hostname: Render's private DNS name for the backend
      # did not resolve from the frontend container (ENOTFOUND ...-vaew), so the
      # public URL is the reliable target. The browser still only talks to this
      # frontend origin; /api and /audio are proxied server-side to the backend.
      - key: BACKEND_INTERNAL_URL
        value: https://podcast-backend-vaew.onrender.com
